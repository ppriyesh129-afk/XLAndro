name: Inspect JuggernautXL

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch safetensors transformers diffusers accelerate huggingface_hub pandas matplotlib

      - name: Download JuggernautXL
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p models
          python <<'PY'
          from huggingface_hub import hf_hub_download
          import os

          hf_hub_download(
              repo_id="RunDiffusion/Juggernaut-XL-v9",
              filename="Juggernaut-XL_v9_RunDiffusionPhoto_v2.safetensors",
              local_dir="models",
              token=os.environ["HF_TOKEN"]
          )
          PY

      - name: Create reports folder
        run: mkdir -p reports

      - name: Inspect model
        run: python scripts/inspect_unet.py

      - uses: actions/upload-artifact@v4
        with:
          name: juggernaut-inspection
          path: reports/
