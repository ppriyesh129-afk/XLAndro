
name: Inspect JuggernautXL

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install torch safetensors transformers diffusers accelerate pandas matplotlib

      - name: Create reports folder
        run: mkdir -p reports

      - name: Inspect model
        run: python scripts/inspect_unet.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: juggernaut-inspection
          path: reports/
